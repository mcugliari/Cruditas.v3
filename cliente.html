<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacer Pedido | Cruditas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; padding-bottom: 90px; }
    .header-app { background: #111; color: #fff; padding: 15px; border-bottom: 3px solid #ffc107; }
    .card-prod { border: none; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 10px; }
    .btn-qty { width: 32px; height: 32px; padding: 0; border-radius: 50%; font-weight: bold; }
    .sticky-cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 12px 16px; box-shadow: 0 -3px 10px rgba(0,0,0,0.1); z-index: 1000; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="header-app text-center">
    <h5 class="m-0 font-weight-bold text-warning">🍕 CRUDITAS 🥟</h5>
    <small class="text-light">Menú de Autogestión</small>
  </div>

  <div class="container py-3" id="contenedor-productos-cliente">
    <p class="text-center text-muted">Cargando menú...</p>
  </div>

  <!-- Barra flotante de carrito -->
  <div class="sticky-cart-bar">
    <button class="btn btn-warning btn-block btn-lg font-weight-bold d-flex justify-content-between align-items-center" id="btn-confirmar-pedido" disabled>
      <span class="badge badge-dark px-2 py-1" id="cant-items-carrito">0 u.</span>
      <span>ENVIAR PEDIDO</span>
      <span id="monto-total-carrito">$0</span>
    </button>
  </div>

  <!-- Modal Datos del Cliente -->
  <div class="modal fade" id="modalConfirmarCliente" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header bg-warning">
        <h5 class="modal-title font-weight-bold">Datos para el Pedido</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="font-weight-bold small">Tu Nombre / Referencia *</label>
          <input type="text" class="form-control" id="cliente-nombre" placeholder="Ej: Juan Pérez" required>
        </div>
        <div class="form-group">
          <label class="font-weight-bold small">Teléfono / WhatsApp *</label>
          <input type="text" class="form-control" id="cliente-telefono" placeholder="Ej: 1122334455" required>
        </div>
        <div class="form-group">
          <label class="font-weight-bold small">Modalidad</label>
          <input type="text" class="form-control bg-light" id="cliente-modalidad" value="Retiro por el local" readonly>
        </div>
        <div class="form-group">
          <label class="font-weight-bold small">Observaciones / Aclaraciones</label>
          <textarea class="form-control" id="cliente-observaciones" rows="2" placeholder="Ej: Empanadas bien doradas, sin cebolla, etc."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-success btn-block font-weight-bold" id="btn-finalizar-pedido">
          ✅ CONFIRMAR Y GUARDAR
        </button>
      </div>
    </div>
  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./cliente.js"></script>
</body>
</html>
