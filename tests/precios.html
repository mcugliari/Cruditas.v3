<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas de precios y descuento por docena</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 980px; margin: 24px auto; padding: 0 16px; color: #1b2a3d; }
    h1 { font-size: 1.4rem; }
    #resumen { padding: 12px 16px; border-radius: 10px; font-weight: 700; margin: 12px 0 20px; }
    #resumen.ok { background: #e3f6ea; color: #0f5d2f; }
    #resumen.mal { background: #fde8e8; color: #8c1d18; }
    h2 { font-size: 1.05rem; margin: 22px 0 6px; }
    table { border-collapse: collapse; width: 100%; }
    td { padding: 6px 8px; border-bottom: 1px solid #e3e7ed; vertical-align: top; font-size: .92rem; }
    td.estado { width: 60px; font-weight: 800; }
    .ok-fila .estado { color: #168647; }
    .mal-fila { background: #fff1f1; }
    .mal-fila .estado { color: #b42318; }
    code { font-size: .85rem; }
    p.nota { color: #5b6878; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Pruebas de precios y descuento por docena</h1>
  <p class="nota">Se ejecutan solas al abrir esta página. Usan las mismas funciones que el POS (<code>precios.js</code> y <code>formatearPesos</code> de <code>utils.js</code>).
     Hay que abrirla desde el mismo servidor que la aplicación (no con doble clic sobre el archivo).</p>
  <div id="resumen">Ejecutando…</div>
  <div id="detalle"></div>

  <script type="module">
    import { buscarPrecio, calcularSubtotalItem, resumirPedido, listaTienePrecios } from '../precios.js';
    import { formatearPesos } from '../utils.js';
    import { ejecutarTodo } from './casos-precios.js';

    const resultados = ejecutarTodo({ buscarPrecio, calcularSubtotalItem, resumirPedido, formatearPesos, listaTienePrecios });
    const grupos = [...new Set(resultados.map(r => r.grupo))];
    const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    document.getElementById('detalle').innerHTML = grupos.map(g => `
      <h2>${esc(g)}</h2>
      <table>${resultados.filter(r => r.grupo === g).map(r => `
        <tr class="${r.ok ? 'ok-fila' : 'mal-fila'}">
          <td class="estado">${r.ok ? 'OK' : 'FALLA'}</td>
          <td>${esc(r.nombre)}${r.ok ? '' : `<br><code>esperado: ${esc(JSON.stringify(r.esperado))}<br>obtenido: ${esc(JSON.stringify(r.obtenido))}</code>`}</td>
        </tr>`).join('')}
      </table>`).join('');

    const malas = resultados.filter(r => !r.ok).length;
    const resumen = document.getElementById('resumen');
    resumen.className = malas === 0 ? 'ok' : 'mal';
    resumen.textContent = malas === 0 ? `Todo bien: ${resultados.length} de ${resultados.length} pruebas aprobadas.` : `Hay ${malas} prueba(s) con falla de ${resultados.length}.`;
    document.title = (malas === 0 ? 'OK' : 'FALLA') + ' · pruebas de precios';
    window.__resultado = { total: resultados.length, malas };
  </script>
</body>
</html>
